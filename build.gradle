plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Java Sound decoders for MP3 and OGG. Include their runtime libraries in the mod JAR.
    include(implementation("com.googlecode.soundlibs:mp3spi:1.9.5.4"))
    include(implementation("com.googlecode.soundlibs:vorbisspi:1.0.3.3"))
    include(implementation("com.googlecode.soundlibs:jlayer:1.0.1.4"))
    include(implementation("com.googlecode.soundlibs:jorbis:0.0.17.4"))
    include(implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4"))
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
