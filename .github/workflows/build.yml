name: Build Crystal Radio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Verify remapped mod JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name 'crystal-radio-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$JAR_FILE" ]; then
            echo "Remapped mod JAR was not found."
            ls -la build/libs
            exit 1
          fi
          echo "Checking $JAR_FILE"
          jar tf "$JAR_FILE" | grep -Fx 'ru/crystalcraft/radio/CrystalRadioClient.class'
          jar tf "$JAR_FILE" | grep -Fx 'fabric.mod.json'

      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Radio-1.21.11
          path: |
            build/libs/crystal-radio-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
